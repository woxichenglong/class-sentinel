name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true

      - name: Verify bundled X480 model assets
        working-directory: app/src/main/assets/asr/x-asr-zh-en-480ms
        run: |
          set -euo pipefail
          verify_asset() {
            local file="$1"
            local expected_bytes="$2"
            local expected_sha="$3"
            test -f "$file"
            local actual_bytes
            actual_bytes="$(stat -c '%s' "$file")"
            test "$actual_bytes" -eq "$expected_bytes"
            local actual_sha
            actual_sha="$(sha256sum "$file")"
            actual_sha="${actual_sha%% *}"
            test "$actual_sha" = "$expected_sha"
            printf '%s bytes=%s sha256=%s\n' "$file" "$actual_bytes" "$actual_sha"
          }
          verify_asset encoder-480ms.onnx 592968361 0c3454033d249081df124ddcd7adaf3deca07d0b999b26f2ee5d2475d37abc74
          verify_asset decoder-480ms.onnx 11309084 3658368d274a5d5fd39a7ac20c46bed0ad9cfea1f0feddef30d5d89797c1f499
          verify_asset joiner-480ms.onnx 10260467 03781c98165a2385024c9cecdd2b6b13310d81db23a62c7da420782c2915cf81
          verify_asset tokens.txt 58806 b818a60878b9aae978cbb8ad594acbd403d76d1af2e31ef4197c84e2dbdba27c

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/classsentinel-release.jks"
          chmod 600 "$RUNNER_TEMP/classsentinel-release.jks"
          test -s "$RUNNER_TEMP/classsentinel-release.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/classsentinel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK and write SHA-256
        env:
          APK: app/build/outputs/apk/release/app-release.apk
          HASH_FILE: ${{ runner.temp }}/app-release.apk.sha256
        run: |
          set -euo pipefail
          test -s "$APK"
          stat -c 'release_apk_bytes=%s' "$APK"
          sha256sum "$APK" | tee "$HASH_FILE"

      - name: Upload release APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: class-sentinel-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/app-release.apk.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/app-release.apk.sha256" \
            --verify-tag \
            --title "ClassSentinel $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/classsentinel-release.jks"
